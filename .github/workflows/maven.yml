name: Java CI with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        jdk: [8, 27]

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: ${{ matrix.jdk }}
        cache: maven

    - name: Build with Maven
      run: mvn -B package
