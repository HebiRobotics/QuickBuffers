name: Release Native Plugins

on:
  push:
    branches: [ release/native-plugins ] # note that branch triggers have no inputs, not even defaults
  workflow_dispatch:
    inputs:
      mavenGoal:
        type: choice
        description: "Maven Goal"
        default: 'deploy'
        options:
          - 'package'
          - 'verify'
          - 'deploy'
      skipTests:
        description: "Skip Tests"
        type: boolean
        default: false
      makeConveyorSite:
        description: "Conveyor Site"
        type: boolean
        default: true
      conveyorRevision:
        description: "Conveyor Revision"
        default: '0'

jobs:
  native-plugins:
    strategy:
      fail-fast: false # keep going to see whether a failure is platform specific
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x86_64
            timeout: 15
          - runner: macos-15
            platform: osx-aarch_64
            timeout: 10
          - runner: ubuntu-24.04 # statically linked against musl
            platform: linux-x86_64
            timeout: 15
          - runner: ubuntu-22.04-arm # dynamically linked against glibc 2.35
            platform: linux-aarch_64
            timeout: 15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
    - uses: actions/checkout@v7
    - uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.11
    - uses: graalvm/setup-graalvm@v1
      with:
        distribution: 'graalvm'
        version: '25.5'
        native-image-musl: ${{ matrix.platform == 'linux-x86_64' }}
        native-image-job-reports: 'true'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build native plugins # also builds dependencies to the output
      run: |
        echo "GRAALVM_HOME: $GRAALVM_HOME"
        echo "JAVA_HOME: $JAVA_HOME"
        mvn clean package --projects "protoc-gen-quickbuf,quickbuf-compat" -am -P"makeNative,useNative" -DskipTests="${{ github.event.inputs.skipTests }}"

    - name: Check plugin architecture and minimum macOS version
      if: ${{ runner.os == 'macOS' }}
      run: |
        for exe in protoc-gen-*/target/*.exe; do
          file "$exe"
          otool -l "$exe" | grep -A4 LC_BUILD_VERSION | grep minos || echo "  no LC_BUILD_VERSION"
        done

    - name: Upload native plugins
      uses: actions/upload-artifact@v7
      with:
        name: native-plugins-${{ matrix.platform }}
        path: "protoc-gen-*/target/*.exe"
        retention-days: 10

  native-plugins-rosetta: # GraalVM has no macOS x64 builds after 25.0.1, so the x64 Liberica NIK runs under Rosetta
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
    - uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.11

    - name: Set up x64 Liberica NIK
      run: |
        sudo softwareupdate --install-rosetta --agree-to-license
        archive="bellsoft-liberica-vm-openjdk25.0.5.0.3+6-25.0.5.0.3+1-macos-amd64.tar.gz"
        curl -sSfLO "https://github.com/bell-sw/LibericaNIK/releases/download/25.0.5.0.3+1-25.0.5.0.3+6/$archive"
        echo "d6846e1858e260cb6bf4b8685531a5afbd7cd3c3  $archive" | shasum -a 1 -c
        mkdir "$RUNNER_TEMP/graalvm"
        tar -xzf "$archive" -C "$RUNNER_TEMP/graalvm" --strip-components=1
        echo "JAVA_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
        echo "GRAALVM_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"

    - name: Build native plugins # also builds dependencies to the output
      run: |
        echo "GRAALVM_HOME: $GRAALVM_HOME"
        echo "JAVA_HOME: $JAVA_HOME"
        arch -x86_64 mvn clean package --projects "protoc-gen-quickbuf,quickbuf-compat" -am -P"makeNative,useNative" -Dnative.optimizationLevel=b -DskipTests="${{ github.event.inputs.skipTests }}"

    - name: Check plugin architecture and minimum macOS version
      run: |
        for exe in protoc-gen-*/target/*.exe; do
          file "$exe"
          otool -l "$exe" | grep -A4 LC_BUILD_VERSION | grep minos || echo "  no LC_BUILD_VERSION"
        done

    - name: Upload native plugins
      uses: actions/upload-artifact@v7
      with:
        name: native-plugins-osx-x86_64
        path: "protoc-gen-*/target/*.exe"
        retention-days: 10

  maven-artifacts:
    needs: [native-plugins, native-plugins-rosetta]
    runs-on: [ubuntu-24.04]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    continue-on-error: false
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 8
    - uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.11

    - name: Import GPG Key
      uses: crazy-max/ghaction-import-gpg@v7
      with:
        gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

    - name: Clean Workspace
      run: mvn clean

    - name: Download pre-built native plugins
      uses: actions/download-artifact@v8
      with:
        pattern: native-plugins-*
        merge-multiple: true
        path: .

    - name: Test Native Plugins
      run: |
        chmod +x */target/**.exe
        mvn -B -U package \
          -P"release,useNative" \
          --projects "protoc-gen-quickbuf,quickbuf-compat" -am \
          -DskipTests="${{ github.event.inputs.skipTests }}"

    - name: Deploy Maven Artifacts
      env:
        MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }} # Central Portal user token
        MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
        GPG_KEYNAME: ${{ secrets.MAVEN_GPG_KEYNAME }}
        GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: |
        echo GPG_TTY=$(tty) >> $GITHUB_ENV
        mvn -B -U ${{ github.event.inputs.mavenGoal }} \
          -s settings.xml \
          -DautoPublish=true \
          -P"release" \
          --projects "protoc-gen-quickbuf,quickbuf-compat" -am \
          -DskipTests="${{ github.event.inputs.skipTests }}"

  conveyor-site:
    needs: [native-plugins, native-plugins-rosetta]
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    continue-on-error: false
    if: ${{ github.event.inputs.makeConveyorSite == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
          cache: maven
      - uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.11

      - name: Clean Workspace
        run: mvn clean

      - name: Download pre-built native plugins
        uses: actions/download-artifact@v8
        with:
          pattern: native-plugins-*
          merge-multiple: true
          path: .

      - name: Test Native Plugins
        run: |
          chmod +x */target/**.exe
          mvn -B -U package \
            -P"release,useNative" \
            --projects "protoc-gen-quickbuf,quickbuf-compat" -am \
            -DskipTests="${{ github.event.inputs.skipTests }}"

      - name: Create DigiCert auth cert
        id: auth_cert
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'DigiCert_auth.p12'
          encodedString: ${{ secrets.DIGICERT_AUTH_CERT_BASE64 }}

      - name: Conveyor Site
        uses: hydraulic-software/conveyor/actions/build@v22.3
        env:
          APPLE_APP_ID: ${{secrets.APPLE_APP_ID}}
          APPLE_APP_TEAM_ID: ${{secrets.APPLE_APP_TEAM_ID}}
          APPLE_APP_PASSWORD: ${{secrets.APPLE_APP_PASSWORD}}
          SIGNING_KEY: ${{secrets.CONVEYOR_SIGNING_KEY}}
          DIGICERT_AUTH_CERT: ${{steps.auth_cert.outputs.filePath}}
          DIGICERT_AUTH_PW: ${{secrets.DIGICERT_AUTH_PW}}
          DIGICERT_API_KEY: ${{secrets.DIGICERT_API_KEY}}
          DIGICERT_SIGNING_KEY_ALIAS: ${{secrets.DIGICERT_SIGNING_KEY_ALIAS}}
        with:
          conveyor_version: '22.3'
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1
          command: make site
          extra_flags: -Kapp.revision="${{ github.event.inputs.conveyorRevision }}" -f conveyor-ci.conf

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: conveyor
          path: output/*
          retention-days: 10
          # TODO: publish to Github releases directly?
